[project]
name = "kumdofetch"
version = "0.1.0"
description = "Kumdo board new-post notifier via atd-alert"
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4>=4.12",
    "requests>=2.31",
    "pydantic>=2.9",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.7",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
# Legacy one-off ICS converter: outside the kumdofetch ATD migration scope.
exclude = ["convert_event_to_ics.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
