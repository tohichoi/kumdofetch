# kumdofetch - non-secret configuration (SSOT).
# Secrets (atd-alert caller token) live only in the ATD_ALERT_TOKEN environment variable.

[notifier]
url = "http://atd-alert:8099"
topic = "대한검도회"
timeout_seconds = 30
message_max_chars = 4096
test_message = "[kumdofetch] atd-alert 연결 테스트입니다."
empty_message = "새 글이 없습니다."

[scraper]
timeout_seconds = 30
# 게시판 1페이지가 고정 공지로만 채워질 수 있어 2페이지까지 훑는다.
max_pages = 2

[scheduler]
interval_seconds = 7200
max_consecutive_failures = 3

[state]
path = "old_articles.pickle"

[[sources]]
name = "center_notice"
